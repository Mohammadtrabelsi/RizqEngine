services:
  # ------------------------------------------------------------------
  # PHP-FPM: runs the Laravel application code that lives in ./src
  # ------------------------------------------------------------------
  app:
    build:
      context: ./php
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: triangle-pos-dev-app
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - triangle

  # ------------------------------------------------------------------
  # Nginx: serves ./src/public and forwards PHP requests to php-fpm
  # ------------------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - triangle

  # ------------------------------------------------------------------
  # MySQL database. Laravel connects to this using host "db".
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-triangle_pos}
      MYSQL_USER: ${DB_USERNAME:-triangle}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - triangle

  # ------------------------------------------------------------------
  # phpMyAdmin: web UI for the MySQL database.
  # ------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - triangle

networks:
  triangle:
    driver: bridge

volumes:
  dbdata:
