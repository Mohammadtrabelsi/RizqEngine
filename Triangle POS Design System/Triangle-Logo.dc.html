<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="nocturne-styles.css"></link>
</helmet>
<div style="min-height:100vh; background:var(--color-bg); color:var(--color-text); display:flex; flex-direction:column; align-items:center; gap:var(--space-8); padding:80px 24px">

  <div style="display:flex; flex-direction:column; align-items:center; gap:var(--space-4)">
    <svg width="120" height="108" viewBox="0 0 100 90">
      <polygon points="50,5 27.5,47.5 72.5,47.5" fill="none" stroke="var(--color-text)" stroke-width="4" stroke-linejoin="round"></polygon>
      <polygon points="5,90 27.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="4" stroke-linejoin="round"></polygon>
      <polygon points="95,90 72.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="4" stroke-linejoin="round"></polygon>
      <polygon points="27.5,47.5 72.5,47.5 50,90" fill="var(--color-accent)" stroke="var(--color-accent)" stroke-width="4" stroke-linejoin="round"></polygon>
    </svg>
    <div style="font-family:var(--font-heading); font-weight:500; font-size:14px; letter-spacing:0.24em; text-transform:uppercase">Triangle POS</div>
  </div>

  <div style="display:flex; flex-wrap:wrap; gap:var(--space-6); justify-content:center; max-width:1000px; width:100%">

    <div class="card elev-sm" style="flex:1; min-width:240px; align-items:center; padding:var(--space-8)">
      <svg width="64" height="58" viewBox="0 0 100 90">
        <polygon points="50,5 27.5,47.5 72.5,47.5" fill="none" stroke="var(--color-text)" stroke-width="5"></polygon>
        <polygon points="5,90 27.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="5"></polygon>
        <polygon points="95,90 72.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="5"></polygon>
        <polygon points="27.5,47.5 72.5,47.5 50,90" fill="var(--color-accent)" stroke="var(--color-accent)" stroke-width="5"></polygon>
      </svg>
      <div class="card-meta" style="margin-top:var(--space-3)">Primary mark</div>
    </div>

    <div class="card elev-sm" style="flex:1; min-width:240px; align-items:center; padding:var(--space-8); background:var(--color-neutral-900)">
      <svg width="64" height="58" viewBox="0 0 100 90">
        <polygon points="50,5 27.5,47.5 72.5,47.5" fill="none" stroke="var(--color-neutral-100)" stroke-width="5"></polygon>
        <polygon points="5,90 27.5,47.5 50,90" fill="none" stroke="var(--color-neutral-100)" stroke-width="5"></polygon>
        <polygon points="95,90 72.5,47.5 50,90" fill="none" stroke="var(--color-neutral-100)" stroke-width="5"></polygon>
        <polygon points="27.5,47.5 72.5,47.5 50,90" fill="var(--color-accent-400)" stroke="var(--color-accent-400)" stroke-width="5"></polygon>
      </svg>
      <div class="card-meta" style="margin-top:var(--space-3)">On deep ground</div>
    </div>

    <div class="card elev-sm" style="flex:1; min-width:240px; align-items:center; padding:var(--space-8)">
      <svg width="64" height="58" viewBox="0 0 100 90">
        <polygon points="50,5 27.5,47.5 72.5,47.5" fill="none" stroke="var(--color-neutral-300)" stroke-width="5"></polygon>
        <polygon points="5,90 27.5,47.5 50,90" fill="none" stroke="var(--color-neutral-300)" stroke-width="5"></polygon>
        <polygon points="95,90 72.5,47.5 50,90" fill="none" stroke="var(--color-neutral-300)" stroke-width="5"></polygon>
        <polygon points="27.5,47.5 72.5,47.5 50,90" fill="var(--color-neutral-300)" stroke="var(--color-neutral-300)" stroke-width="5"></polygon>
      </svg>
      <div class="card-meta" style="margin-top:var(--space-3)">Monochrome</div>
    </div>

    <div class="card elev-sm" style="flex:1; min-width:240px; align-items:center; justify-content:center; padding:var(--space-8)">
      <div style="display:flex; align-items:center; gap:var(--space-3)">
        <svg width="30" height="27" viewBox="0 0 100 90">
          <polygon points="50,5 27.5,47.5 72.5,47.5" fill="none" stroke="var(--color-text)" stroke-width="7"></polygon>
          <polygon points="5,90 27.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="7"></polygon>
          <polygon points="95,90 72.5,47.5 50,90" fill="none" stroke="var(--color-text)" stroke-width="7"></polygon>
          <polygon points="27.5,47.5 72.5,47.5 50,90" fill="var(--color-accent)" stroke="var(--color-accent)" stroke-width="7"></polygon>
        </svg>
        <div style="font-family:var(--font-heading); font-weight:500; font-size:18px">Triangle POS</div>
      </div>
      <div class="card-meta" style="margin-top:var(--space-3)">Lockup</div>
    </div>

  </div>
</div>

</x-dc>
</body>
</html>
